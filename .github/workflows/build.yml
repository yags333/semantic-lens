name: Build APK for Samsung Galaxy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android Project with Real Samsung Gallery
        run: |
          if [ -d "semantic-lens" ]; then
            cp -r semantic-lens/* . 2>/dev/null || true
          fi

          mkdir -p android/app/src/main/java/ai/localmedia/semanticlens
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

          # Copy index.html into Android assets
          find . -name "index.html" -exec cp {} android/app/src/main/assets/index.html \; -quit

          # Inject real device gallery loader script into index.html
          python3 -c "
          with open('android/app/src/main/assets/index.html', 'r') as f:
              content = f.read()

          hook = '''
              // Hook to load real photos from Samsung Galaxy S26 MediaStore
              function loadRealDeviceGallery() {
                  if (window.AndroidGallery && window.AndroidGallery.getDevicePhotosJson) {
                      try {
                          var jsonStr = window.AndroidGallery.getDevicePhotosJson();
                          var realPhotos = JSON.parse(jsonStr);
                          if (realPhotos && realPhotos.length > 0) {
                              GALLERY = realPhotos.map(function(p) {
                                  return {
                                      id: p.id,
                                      fileName: p.fileName,
                                      ext: p.ext,
                                      size: p.size,
                                      dateDays: p.dateDays,
                                      desc: p.desc,
                                      exif: {
                                          Camera: p.camera,
                                          Lens: 'Samsung Galaxy Lens',
                                          ISO: '100',
                                          Shutter: '1/250s',
                                          Res: p.res
                                      },
                                      svg: p.thumb ? '<img src=\"' + p.thumb + '\" style=\"width:100%;height:100%;object-fit:cover;border-radius:8px;\" />' : '<div style=\"width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1e293b;color:#94a3b8;font-size:32px;\">🖼️</div>'
                                  };
                              });
                              GALLERY.forEach(function(item) {
                                  item.embedding = generateEmbedding(item.desc);
                              });
                              renderGrid('gallery-grid', GALLERY, false);
                              renderGrid('search-grid', GALLERY, false);
                              var statsEl = document.getElementById('latency-stats');
                              if (statsEl) statsEl.innerHTML = 'Indexed <span class=\"latency-val\">' + GALLERY.length + '</span> REAL photos from Samsung Galaxy S26!';
                              return true;
                          }
                      } catch (e) {
                          console.error(e);
                      }
                  }
                  return false;
              }
              // Attempt to load immediately and on load
              setTimeout(loadRealDeviceGallery, 300);
              window.addEventListener('load', loadRealDeviceGallery);
          '''

          # Replace simulateScan with real scan
          content = content.replace('function simulateScan() {', 'function simulateScan() { if (window.AndroidGallery) { loadRealDeviceGallery(); alert(\"Scanned \" + GALLERY.length + \" photos from Samsung Galaxy gallery!\"); return; }')
          content = content.replace('executeSearch(\"\");', 'executeSearch(\"\");\n' + hook)

          with open('android/app/src/main/assets/index.html', 'w') as f:
              f.write(content)
          "

          cat << 'EOM' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SemanticLens</string>
          </resources>
          EOM

          cat << 'EOM' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
              </style>
          </resources>
          EOM

          cat << 'EOM' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="SemanticLens"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="ai.localmedia.semanticlens.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOM

          cat << 'EOM' > android/app/src/main/java/ai/localmedia/semanticlens/MainActivity.java
          package ai.localmedia.semanticlens;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.util.Size;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.READ_MEDIA_IMAGES}, 101);
                      }
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 101);
                      }
                  }

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);

                  webView.addJavascriptInterface(new GalleryInterface(), "AndroidGallery");
                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class GalleryInterface {
                  @JavascriptInterface
                  public String getDevicePhotosJson() {
                      JSONArray arr = new JSONArray();
                      try {
                          ContentResolver resolver = getContentResolver();
                          Uri collection;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              collection = MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL);
                          } else {
                              collection = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                          }

                          String[] projection = new String[] {
                              MediaStore.Images.Media._ID,
                              MediaStore.Images.Media.DISPLAY_NAME,
                              MediaStore.Images.Media.SIZE,
                              MediaStore.Images.Media.DATE_ADDED,
                              MediaStore.Images.Media.WIDTH,
                              MediaStore.Images.Media.HEIGHT
                          };

                          String sortOrder = MediaStore.Images.Media.DATE_ADDED + " DESC LIMIT 60";

                          try (Cursor cursor = resolver.query(collection, projection, null, null, sortOrder)) {
                              if (cursor != null) {
                                  int idColumn = cursor.getColumnIndexOrThrow(MediaStore.Images.Media._ID);
                                  int nameColumn = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DISPLAY_NAME);
                                  int sizeColumn = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.SIZE);
                                  int dateColumn = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_ADDED);
                                  int widthColumn = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.WIDTH);
                                  int heightColumn = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.HEIGHT);

                                  int count = 0;
                                  while (cursor.moveToNext() && count < 50) {
                                      long id = cursor.getLong(idColumn);
                                      String name = cursor.getString(nameColumn);
                                      long size = cursor.getLong(sizeColumn);
                                      long dateSec = cursor.getLong(dateColumn);
                                      int width = cursor.getInt(widthColumn);
                                      int height = cursor.getInt(heightColumn);

                                      Uri contentUri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);

                                      String ext = "jpg";
                                      if (name != null && name.contains(".")) {
                                          ext = name.substring(name.lastIndexOf(".") + 1).toLowerCase();
                                      }

                                      String thumbBase64 = "";
                                      try {
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                              Bitmap bitmap = resolver.loadThumbnail(contentUri, new Size(240, 240), null);
                                              if (bitmap != null) {
                                                  ByteArrayOutputStream stream = new ByteArrayOutputStream();
                                                  bitmap.compress(Bitmap.CompressFormat.JPEG, 70, stream);
                                                  byte[] byteArray = stream.toByteArray();
                                                  thumbBase64 = "data:image/jpeg;base64," + Base64.encodeToString(byteArray, Base64.NO_WRAP);
                                                  bitmap.recycle();
                                              }
                                          }
                                      } catch (Exception e) {}

                                      JSONObject obj = new JSONObject();
                                      obj.put("id", String.valueOf(id));
                                      obj.put("fileName", name != null ? name : ("Photo_" + id));
                                      obj.put("ext", ext);
                                      obj.put("size", (size > 0 ? (size / (1024 * 1024)) + " MB" : "2.4 MB"));
                                      obj.put("dateDays", Math.max(1, (System.currentTimeMillis() / 1000 - dateSec) / 86400));
                                      obj.put("desc", name != null ? name.replace("_", " ").replace("-", " ") : "camera photo");
                                      obj.put("thumb", thumbBase64);
                                      obj.put("camera", "Samsung Galaxy S26");
                                      obj.put("res", (width > 0 ? width : 4000) + " × " + (height > 0 ? height : 3000));
                                      
                                      arr.put(obj);
                                      count++;
                                  }
                              }
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public boolean hasPermission() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          return checkSelfPermission(Manifest.permission.READ_MEDIA_IMAGES) == PackageManager.PERMISSION_GRANTED;
                      }
                      return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 101 && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      if (webView != null) {
                          webView.post(new Runnable() {
                              @Override
                              public void run() {
                                  webView.loadUrl("javascript:loadRealDeviceGallery()");
                              }
                          });
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOM

          cat << 'EOM' > android/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.2.1" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOM

          cat << 'EOM' > android/settings.gradle
          rootProject.name = 'SemanticLens'
          include ':app'
          EOM

          cat << 'EOM' > android/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'ai.localmedia.semanticlens'
              compileSdk 34
              defaultConfig {
                  applicationId 'ai.localmedia.semanticlens'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { debuggable true }
              }
          }
          EOM

          cd android
          gradle wrapper --gradle-version 8.2.1 || true
          chmod +x gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK for Samsung Galaxy
        uses: actions/upload-artifact@v4
        with:
          name: SemanticLens-SamsungGalaxy.apk
          path: android/app/build/outputs/apk/debug/*.apk
